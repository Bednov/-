<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>PRO Задачи Нотариус 2026</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>

  <style>
    :root {
      --bg-color: #0b1329;
      --card-bg: #162238;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-blue: #2563eb;
      --accent-cyan: #38bdf8;
      --success-green: #10b981;
      --error-red: #ef4444;
      --warning-amber: #f59e0b;
      --border-color: #334155;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      width: 100%; height: 100%; margin: 0; padding: 0;
      background-color: var(--bg-color); color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Roboto, sans-serif;
      overflow: hidden;
      position: fixed; inset: 0;
      -webkit-text-size-adjust: 100%;
    }

    #app-container {
      display: flex; flex-direction: column; width: 100%; height: 100%;
      padding-top: 4px; padding-bottom: 0px; padding-left: 6px; padding-right: 6px;
      overflow: hidden;
    }

    .header-bar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 4px; background: var(--card-bg); border: 1px solid var(--border-color);
      padding: 6px 10px; border-radius: 12px; flex-shrink: 0; gap: 4px;
    }

    .brand-title {
      font-size: 0.85em; font-weight: 800; color: var(--accent-cyan);
      cursor: pointer; padding: 6px 10px; border-radius: 8px;
      background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .pill-btn {
      background: #1e293b; border: 1px solid var(--border-color); color: var(--text-main);
      padding: 6px 10px; border-radius: 16px; font-size: 0.72em; font-weight: 600; cursor: pointer;
    }
    .pill-btn.exam-btn { background: var(--accent-blue); color: #fff; border-color: var(--accent-cyan); font-weight: 700; }

    #exam-timer-display {
      background: var(--error-red); color: white; padding: 5px 10px; border-radius: 8px;
      font-weight: 800; font-size: 0.85em; display: none; text-align: center;
    }

    .global-progress-wrapper {
      background: var(--card-bg); border: 1px solid var(--border-color);
      border-radius: 10px; padding: 6px 10px; margin-bottom: 4px; flex-shrink: 0;
    }
    .progress-info-row { display: flex; justify-content: space-between; font-size: 0.7em; font-weight: 700; color: var(--text-muted); margin-bottom: 4px; }
    .progress-bar-bg { width: 100%; height: 8px; background: #0f172a; border-radius: 4px; overflow: hidden; border: 1px solid var(--border-color); }
    .progress-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent-blue), var(--accent-cyan)); border-radius: 4px; transition: width 0.4s ease; }

    .dashboard-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 4px; flex-shrink: 0; }
    .stat-box { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 6px 2px; text-align: center; cursor: pointer; }
    .stat-number { font-size: 1.1em; font-weight: 800; }
    .stat-label { font-size: 0.65em; color: var(--text-muted); font-weight: 600; margin-top: 2px; }

    .quiz-card {
      flex: 1 1 0px; min-height: 0;
      background: var(--card-bg); border: 1px solid var(--border-color);
      border-radius: 14px; padding: 12px; margin-bottom: 4px;
      display: flex; flex-direction: column; overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .meta-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; flex-shrink: 0; gap: 8px; }
    
    .topic-badge { 
      background: rgba(59, 130, 246, 0.2); border: 1px solid rgba(59, 130, 246, 0.4); 
      color: #93c5fd; padding: 4px 10px; border-radius: 6px; font-size: 0.75em; font-weight: 700; 
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1;
    }

    .counter-badge { font-size: 0.75em; color: var(--text-muted); font-weight: 700; flex-shrink: 0; }

    .question-text { font-size: 0.95em; font-weight: 700; line-height: 1.35; color: #ffffff; margin-bottom: 12px; white-space: pre-line; }
    .answers-container { display: flex; flex-direction: column; gap: 6px; }

    .opt-button {
      background: #1e293b; border: 1px solid var(--border-color); color: #f1f5f9;
      padding: 10px 12px; border-radius: 10px; text-align: left; font-size: 0.88em;
      font-weight: 500; line-height: 1.3; cursor: pointer;
    }
    .opt-button.correct { background: rgba(16, 185, 129, 0.25) !important; border-color: var(--success-green) !important; color: #34d399 !important; font-weight: 700; }
    .opt-button.wrong { background: rgba(239, 68, 68, 0.25) !important; border-color: var(--error-red) !important; color: #fca5a5 !important; }

    .legal-analysis-box { margin-top: 10px; padding: 10px; background: #0f172a; border-left: 3px solid var(--accent-blue); border-radius: 8px; display: none; font-size: 0.82em; line-height: 1.35; }

    .bottom-nav { display: flex; gap: 6px; flex-shrink: 0; margin-bottom: 0px; }
    .nav-btn { flex: 1; background: var(--accent-blue); color: #ffffff; border: none; padding: 12px 6px; border-radius: 10px; font-weight: 700; font-size: 0.85em; cursor: pointer; text-align: center; }
    .nav-btn.secondary { background: #334155; }
    .nav-btn.home-btn { background: #0284c7; }

    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(11, 19, 41, 0.98); backdrop-filter: blur(10px); z-index: 100; display: none; flex-direction: column; padding: 16px; overflow-y: auto; }
    .topic-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
    .block-btn { background: #1e293b; border: 1px solid var(--border-color); color: var(--accent-cyan); padding: 8px; border-radius: 8px; text-align: center; font-size: 0.8em; font-weight: 700; cursor: pointer; }
    
    .search-bar-input { width: 100%; background: #1e293b; border: 1px solid var(--border-color); color: #fff; padding: 8px 12px; border-radius: 8px; font-size: 0.85em; margin-bottom: 12px; }
    .result-screen { text-align: center; padding: 20px 10px; }
    .verdict-badge { display: inline-block; padding: 12px 34px; border-radius: 20px; font-size: 1.6em; font-weight: 900; margin-bottom: 15px; text-transform: uppercase; }
    .verdict-badge.passed { background: var(--success-green); color: white; box-shadow: 0 0 15px rgba(16,185,129,0.4); }
    .verdict-badge.failed { background: var(--error-red); color: white; box-shadow: 0 0 15px rgba(239,68,68,0.4); }
  </style>
</head>
<body>

<div id="app-container">
  <header class="header-bar">
    <div class="brand-title" onclick="openRandomTask()">⚖️ Задачи Pro 🔀</div>
    <div id="exam-timer-display">60:00</div>
    <div style="display: flex; gap: 4px; align-items: center; flex-wrap: wrap;">
      <button id="sound-toggle-btn" class="pill-btn" onclick="AudioEngine.toggleMute()">🔊 Звук</button>
      <button class="pill-btn exam-btn" onclick="startOfficialExamMode()">⏱️ Билет (50)</button>
      <button class="pill-btn" onclick="openTopicsModal()">📚 Задачи</button>
      <button class="pill-btn" onclick="resetFullState()" style="color: var(--error-red);">🗑️ Сброс</button>
    </div>
  </header>

  <section class="global-progress-wrapper">
    <div class="progress-info-row">
      <span>🚀 Общий прогресс базы:</span>
      <span id="ui-global-progress-text" style="color: var(--accent-cyan);">0 / 0</span>
    </div>
    <div class="progress-bar-bg"><div id="ui-global-progress-bar" class="progress-bar-fill"></div></div>
  </section>

  <section class="dashboard-grid">
    <div class="stat-box" onclick="startErrorReviewSession()" style="border-color: var(--error-red);"><div class="stat-number" id="ui-errors-count" style="color: var(--error-red);">0</div><div class="stat-label">❌ Ошибки</div></div>
    <div class="stat-box" onclick="startFavoritesReviewSession()" style="border-color: var(--warning-amber);"><div class="stat-number" id="ui-fav-count" style="color: var(--warning-amber);">0</div><div class="stat-label">⭐ Избранное</div></div>
    <div class="stat-box"><div class="stat-number" id="ui-accuracy-rate" style="color: var(--success-green);">0%</div><div class="stat-label">Точность</div></div>
    <div class="stat-box"><div class="stat-number" id="ui-progress-pos" style="color: var(--accent-cyan);">1 / 0</div><div class="stat-label">Позиция</div></div>
  </section>

  <article class="quiz-card" id="quiz-card-element">
    <div class="meta-bar">
      <span class="topic-badge" id="ui-topic-tag">📌 Задача №1</span>
      <div style="display: flex; gap: 6px; align-items: center; flex-shrink: 0;">
        <button id="fav-toggle-btn" class="pill-btn" onclick="toggleCurrentFavorite()" style="padding: 2px 6px; font-size: 0.9em;">☆</button>
        <span class="counter-badge" id="ui-question-counter">0 / 0</span>
      </div>
    </div>
    <div id="dynamic-content-root">
      <div style="text-align: center; padding: 25px; color: var(--accent-cyan);">⏳ Авто-подключение к базе задач (READMY1.md)...</div>
    </div>
  </article>

  <footer class="bottom-nav">
    <button class="nav-btn secondary" onclick="navigatePrevious()">⬅️ Назад</button>
    <button class="nav-btn home-btn" onclick="openAllTasksMenu()">🏠 Все задачи</button>
    <button class="nav-btn secondary" onclick="triggerShuffleBlock()">🔀 Блок</button>
    <button class="nav-btn" onclick="navigateNext()">Вперёд ➡️</button>
  </footer>
</div>

<!-- Модальное окно каталога задач и выбора режима -->
<div class="modal-overlay" id="topics-modal">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; position: sticky; top: 0; background: var(--bg-color); padding: 8px 0; z-index: 10;">
    <h2 id="modal-title-text" style="margin: 0; font-size: 1.1em; color: var(--accent-cyan);">📚 Каталог задач и поиск</h2>
    <button class="pill-btn" onclick="closeTopicsModal()" style="background: var(--accent-blue); padding: 8px 14px;">К тесту</button>
  </div>
  <div id="modal-search-wrapper">
    <input type="text" id="search-input" class="search-bar-input" placeholder="🔍 Поиск по условию задач..." oninput="filterTopicsAndQuestions(this.value)">
  </div>
  <div id="topics-list-container"></div>
</div>

<script>
  const AudioEngine = {
    ctx: null,
    isMuted: false,
    init() {
      if (!this.ctx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) this.ctx = new AudioCtx();
      }
    },
    toggleMute() {
      this.isMuted = !this.isMuted;
      const btn = document.getElementById('sound-toggle-btn');
      if (btn) btn.innerText = this.isMuted ? "🔇 Без звука" : "🔊 Звук";
      return this.isMuted;
    },
    playCorrect() {
      if (this.isMuted) return;
      try {
        this.init();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.frequency.setValueAtTime(587.33, this.ctx.currentTime);
        osc.frequency.setValueAtTime(880, this.ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.25);
        osc.start(); osc.stop(this.ctx.currentTime + 0.25);
      } catch(e) {}
    },
    playWrong() {
      if (this.isMuted) return;
      try {
        this.init();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(160, this.ctx.currentTime);
        gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.3);
        osc.start(); osc.stop(this.ctx.currentTime + 0.3);
      } catch(e) {}
    }
  };

  let isTransitioning = false; 
  let RAW_EXCEL_TESTS = [];
  const DEFAULT_STATE = { currentIndex: 0, totalAnswered: 0, correctCount: 0, errorIds: [], favoritesIds: [], sessionQueue: [] };
  
  let AppState = { ...DEFAULT_STATE };
  let SavedProgressState = JSON.parse(localStorage.getItem('notary_tasks_stats_save_v1')) || { totalAnswered: 0, correctCount: 0, errorIds: [], favoritesIds: [] };
  let GlobalMasteredIds = JSON.parse(localStorage.getItem('notary_tasks_global_mastered_v1')) || [];
  
  let isExamMode = false;
  let examCountdown = null;
  let examTimeLeft = 3600; 
  let examScore = { testPoints: 0 };

  function syncStateToStorage() {
    SavedProgressState.totalAnswered = AppState.totalAnswered;
    SavedProgressState.correctCount = AppState.correctCount;
    SavedProgressState.errorIds = AppState.errorIds;
    SavedProgressState.favoritesIds = AppState.favoritesIds;
    localStorage.setItem('notary_tasks_stats_save_v1', JSON.stringify(SavedProgressState));
    localStorage.setItem('notary_tasks_global_mastered_v1', JSON.stringify(GlobalMasteredIds));
    renderDashboardUI();
  }

  function resetFullState() {
    if (confirm("Сбросить статистику текущего круга? Общий вечный прогресс не пострадает!")) {
      clearInterval(examCountdown);
      isExamMode = false;
      isTransitioning = false;
      document.getElementById('exam-timer-display').style.display = "none";
      AppState = { ...DEFAULT_STATE, favoritesIds: SavedProgressState.favoritesIds || [] };
      SavedProgressState.totalAnswered = 0;
      SavedProgressState.correctCount = 0;
      SavedProgressState.errorIds = [];
      buildSessionQueue();
      syncStateToStorage();
      renderCurrentQuestion();
    }
  }

  function toggleCurrentFavorite() {
    if (!AppState.sessionQueue || AppState.sessionQueue.length === 0) return;
    const q = AppState.sessionQueue[AppState.currentIndex];
    if (!q) return;

    if (!AppState.favoritesIds) AppState.favoritesIds = [];
    const idx = AppState.favoritesIds.indexOf(q.id);
    if (idx > -1) {
      AppState.favoritesIds.splice(idx, 1);
    } else {
      AppState.favoritesIds.push(q.id);
    }
    syncStateToStorage();
    updateFavoriteButtonState();
  }

  function updateFavoriteButtonState() {
    const btn = document.getElementById('fav-toggle-btn');
    if (!btn || !AppState.sessionQueue || AppState.sessionQueue.length === 0) return;
    const q = AppState.sessionQueue[AppState.currentIndex];
    if (q && AppState.favoritesIds && AppState.favoritesIds.includes(q.id)) {
      btn.innerText = "⭐";
      btn.style.color = "var(--warning-amber)";
    } else {
      btn.innerText = "☆";
      btn.style.color = "var(--text-main)";
    }
    document.getElementById('ui-fav-count').innerText = (AppState.favoritesIds || []).length;
  }

  function startFavoritesReviewSession() {
    if (!AppState.favoritesIds || AppState.favoritesIds.length === 0) { alert("Список избранного пуст! Нажимайте звездочку у сложных задач."); return; }
    let favQuestions = [...RAW_EXCEL_TESTS].filter(q => AppState.favoritesIds.includes(q.id));
    AppState.sessionQueue = favQuestions.map(q => ({ ...q, topic: "⭐ Избранное" }));
    AppState.currentIndex = 0;
    renderCurrentQuestion();
  }

  function startErrorReviewSession() {
    if (!AppState.errorIds || AppState.errorIds.length === 0) { alert("Список ошибок пуст! Отличный результат."); return; }
    let errorQuestions = [...RAW_EXCEL_TESTS].filter(q => AppState.errorIds.includes(q.id));
    AppState.sessionQueue = errorQuestions.map(q => ({ ...q, topic: "❌ Ошибки" }));
    AppState.currentIndex = 0;
    renderCurrentQuestion();
  }

  function startOfficialExamMode() {
    if (RAW_EXCEL_TESTS.length === 0) { alert("База данных задач еще подгружается!"); return; }
    
    isExamMode = true;
    isTransitioning = false;
    examTimeLeft = 3600; 
    examScore = { testPoints: 0 };

    document.getElementById('exam-timer-display').style.display = "block";
    clearInterval(examCountdown);
    examCountdown = setInterval(() => {
      examTimeLeft--;
      if (examTimeLeft <= 0) {
        clearInterval(examCountdown);
        finishOfficialExam();
      } else {
        let mins = Math.floor(examTimeLeft / 60);
        let secs = examTimeLeft % 60;
        document.getElementById('exam-timer-display').innerText = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
      }
    }, 1000);

    let shuffledTests = [...RAW_EXCEL_TESTS].sort(() => Math.random() - 0.5).slice(0, Math.min(50, RAW_EXCEL_TESTS.length));
    AppState.sessionQueue = shuffledTests;
    AppState.currentIndex = 0;
    renderCurrentQuestion();
  }

  function finishOfficialExam() {
    clearInterval(examCountdown);
    document.getElementById('exam-timer-display').style.display = "none";
    isTransitioning = false;
    
    let totalPoints = examScore.testPoints;
    let isPassed = totalPoints >= (AppState.sessionQueue.length * 0.8); 

    const root = document.getElementById('dynamic-content-root');
    document.getElementById('ui-topic-tag').innerText = "🏁 Экзамен завершен";
    
    root.innerHTML = `
      <div class="result-screen">
        <div class="verdict-badge ${isPassed ? 'passed' : 'failed'}">${isPassed ? 'СДАЛ' : 'НЕ СДАН'}</div>
        <h3 style="margin: 10px 0;">Правильных ответов: ${totalPoints} из ${AppState.sessionQueue.length}</h3>
        <button class="nav-btn home-btn" style="width: 100%; padding:14px;" onclick="isExamMode=false; buildSessionQueue('sequential'); renderCurrentQuestion();">Вернуться к тренировке</button>
      </div>
    `;
    isExamMode = false;
  }

  function parseTextData(fullText) {
    const lines = fullText.split('\n').map(l => l.trim()).filter(Boolean);
    let parsedData = [];
    let currentQ = null;

    lines.forEach((line) => {
      const normalized = line.replace(/\s+/g, '');

      if (normalized.startsWith('<Задача№>') || normalized.startsWith('<Задача№>:')) {
        if (currentQ && currentQ.options.length > 0) {
          parsedData.push(currentQ);
        }
        const matchNum = line.match(/\d+/);
        const qNum = matchNum ? parseInt(matchNum[0], 10) : (parsedData.length + 1);
        currentQ = { 
          id: 2000 + parsedData.length,
          originalIndex: qNum,
          topic: `Задача №${qNum}`,
          title: "", 
          question: "",
          options: [], 
          correct: 0,
          correctIndex: 0,
          legalBasis: { rule: "Законодательство РФ о нотариате", logic: "Материал квалификационного экзамена по задачам." }
        };
      } else if (line.startsWith('<Задача>:')) {
        const text = line.replace(/^<Задача>:\s*/, '');
        if (currentQ) {
          currentQ.title = text;
          currentQ.question = text;
        }
      } else if (normalized.startsWith('<Вариантыответа>:')) {
        // Пропускаем
      } else if (/^<\d+>:/.test(normalized) || /^<\d+>/.test(line)) {
        const optText = line.replace(/^<\d+>:\s*/, '').replace(/^<\d+>\s*/, '');
        if (currentQ) {
          currentQ.options.push(optText);
        }
      } else if (line.startsWith('<Правильный ответ>:') || line.startsWith('Правильный ответ>:')) {
        const matchNum = line.match(/\d+/);
        if (matchNum && currentQ) {
          currentQ.correct = parseInt(matchNum[0], 10) - 1;
          currentQ.correctIndex = currentQ.correct;
        }
      } else if (line.startsWith('<Обоснование>:')) {
        const text = line.replace(/^<Обоснование>:\s*/, '');
        if (currentQ) {
          currentQ.legalBasis.rule = text;
        }
      } else if (currentQ) {
        if (currentQ.options.length > 0 && currentQ.options.length <= 4 && !line.startsWith('<')) {
          currentQ.options[currentQ.options.length - 1] += " " + line;
        } else if (!currentQ.title || currentQ.title === currentQ.question && !currentQ.options.length) {
          currentQ.title += (currentQ.title ? " " : "") + line;
          currentQ.question = currentQ.title;
        } else if (currentQ.legalBasis && currentQ.legalBasis.rule) {
          currentQ.legalBasis.rule += " " + line;
        }
      }
    });

    if (currentQ && currentQ.options.length > 0) {
      parsedData.push(currentQ);
    }
    return parsedData;
  }

  async function loadReadmeAndInit() {
    AppState.totalAnswered = SavedProgressState.totalAnswered;
    AppState.correctCount = SavedProgressState.correctCount;
    AppState.errorIds = SavedProgressState.errorIds || [];
    AppState.favoritesIds = SavedProgressState.favoritesIds || [];

    try {
      const response = await fetch("READMY1.md");
      if (!response.ok) throw new Error("Файл не найден");
      const arrayBuffer = await response.arrayBuffer();
      
      mammoth.extractRawText({ arrayBuffer: arrayBuffer })
        .then(result => {
          RAW_EXCEL_TESTS = parseTextData(result.value);
          finishInitialization();
        })
        .catch(() => {
          response.text().then(text => {
            RAW_EXCEL_TESTS = parseTextData(text);
            finishInitialization();
          }).catch(() => showError("Ошибка чтения документа."));
        });
    } catch {
      try {
        const respText = await fetch("READMY1.md");
        const text = await respText.text();
        RAW_EXCEL_TESTS = parseTextData(text);
        finishInitialization();
      } catch {
        showError("Не удалось скачать файл READMY1.md");
      }
    }
  }

  function showError(msg) {
    const root = document.getElementById('dynamic-content-root');
    if (root) root.innerHTML = `<div style="text-align: center; padding: 25px; color: var(--error-red);">❌ ${msg}</div>`;
  }

  function finishInitialization() {
    buildSessionQueue('sequential');
    renderCurrentQuestion();
  }

  function buildSessionQueue(mode = 'sequential', startIdx = 0) {
    let tests = [...RAW_EXCEL_TESTS];

    if (tests.length > 0) {
      if (mode === 'random') {
        AppState.sessionQueue = [...tests].sort(() => Math.random() - 0.5);
        AppState.currentIndex = 0;
      } else {
        // По порядку (sequential)
        AppState.sessionQueue = tests;
        AppState.currentIndex = Math.max(0, Math.min(startIdx, tests.length - 1));
      }
    } else {
      AppState.sessionQueue = [{ id: 0, originalIndex: 1, topic: "Задача №1", question: "В базе данных нет задач.", options: ["Ок"], correct: 0, legalBasis: {rule: "-", logic: "-"} }];
      AppState.currentIndex = 0;
    }
    syncStateToStorage();
  }

  function openAllTasksMenu() {
    const container = document.getElementById('topics-list-container');
    document.getElementById('modal-title-text').innerText = "🏠 Выбор режима задач";
    document.getElementById('modal-search-wrapper').style.display = 'none';

    let html = `
      <div class="topic-card" style="border-color: var(--accent-cyan); background: rgba(56,189,248,0.05);">
        <div style="font-weight: 800; font-size: 0.9em; color: var(--accent-cyan); margin-bottom: 8px;">⚙️ Режим прохождения всей базы (${RAW_EXCEL_TESTS.length} задач):</div>
        <div style="display: flex; gap: 8px;">
          <button class="block-btn" style="flex:1; background: var(--accent-blue); color:#fff;" onclick="selectModeAndStart('sequential', 0)">📌 По порядку</button>
          <button class="block-btn" style="flex:1;" onclick="selectModeAndStart('random', 0)">🔀 Вразброс (Перемешка)</button>
        </div>
      </div>
      <div style="font-weight: 700; font-size: 0.85em; color: var(--text-muted); margin: 12px 0 6px 4px;">📂 Или выберите конкретную задачу по номеру:</div>
    `;

    RAW_EXCEL_TESTS.forEach((q, idx) => {
      html += `
        <div class="topic-card" onclick="selectModeAndStart('sequential', ${idx})" style="cursor:pointer; padding: 8px 12px; margin-bottom: 6px;">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <span style="font-size: 0.75em; font-weight: 700; color: var(--accent-cyan);">Задача №${q.originalIndex || (idx + 1)}</span>
            <span style="font-size: 0.7em; color: var(--text-muted);">#${idx + 1}</span>
          </div>
          <div style="font-weight: 600; font-size: 0.82em; color: #fff; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${q.question}</div>
        </div>
      `;
    });

    container.innerHTML = html;
    document.getElementById('topics-modal').style.display = 'flex';
  }

  function selectModeAndStart(mode, index) {
    buildSessionQueue(mode, index);
    closeTopicsModal();
    renderCurrentQuestion();
  }

  function renderCurrentQuestion() {
    isTransitioning = false; 
    if (!AppState.sessionQueue || AppState.sessionQueue.length === 0) return;
    if (AppState.currentIndex >= AppState.sessionQueue.length) AppState.currentIndex = 0;

    const q = AppState.sessionQueue[AppState.currentIndex];
    
    const qNum = q.originalIndex ? q.originalIndex : (AppState.currentIndex + 1);
    const badgeText = `📌 Задача №${qNum}`;
    
    const topicBadgeEl = document.getElementById('ui-topic-tag');
    topicBadgeEl.innerText = badgeText;
    topicBadgeEl.title = badgeText;

    document.getElementById('ui-question-counter').innerText = `${AppState.currentIndex + 1} / ${AppState.sessionQueue.length}`;
    
    updateFavoriteButtonState();

    const root = document.getElementById('dynamic-content-root');
    let optionsHTML = q.options.map((opt, idx) => `
      <button class="opt-button" onclick="handleOptionSelect(${idx}, ${q.correct}, ${q.id}, this)">
        ${opt}
      </button>
    `).join('');

    root.innerHTML = `
      <div class="question-text">${q.question || q.title}</div>
      <div class="answers-container">${optionsHTML}</div>
      <button class="pill-btn" style="margin-top: 12px; width: 100%; text-align: center; padding:8px;" onclick="toggleLegalHint()">
        ⚖️ Развёрнутое правовое обоснование
      </button>
      <div id="legal-hint-card" class="legal-analysis-box">
        <p style="margin: 0 0 4px 0;"><b>📜 Обоснование:</b> ${q.legalBasis ? q.legalBasis.rule : "Законодательство РФ"}</p>
        ${q.legalBasis && q.legalBasis.logic ? `<p style="margin: 6px 0 0 0; border-top: 1px dashed var(--border-color); padding-top: 6px;"><b>💡 ${q.legalBasis.logic}</b></p>` : ''}
      </div>
    `;
    
    document.getElementById('quiz-card-element').scrollTop = 0;
    renderDashboardUI();
  }

  function handleOptionSelect(selectedIdx, correctIdx, qId, btnElement) {
    if (isTransitioning) return;
    isTransitioning = true; 

    selectedIdx = Number(selectedIdx);
    correctIdx = Number(correctIdx);

    AppState.totalAnswered++;
    const allButtons = document.querySelectorAll('.opt-button');

    if (selectedIdx === correctIdx) {
      AppState.correctCount++;
      if (btnElement) btnElement.classList.add('correct');
      AudioEngine.playCorrect();
      
      if (!GlobalMasteredIds.includes(qId)) GlobalMasteredIds.push(qId);
      
      const errIdx = AppState.errorIds.indexOf(qId);
      if (errIdx > -1) AppState.errorIds.splice(errIdx, 1);

      if (isExamMode) {
        examScore.testPoints += 1; 
      }
    } else {
      if (!AppState.errorIds.includes(qId)) AppState.errorIds.push(qId);
      if (btnElement) btnElement.classList.add('wrong');
      if (allButtons[correctIdx]) allButtons[correctIdx].classList.add('correct');
      AudioEngine.playWrong();
      document.getElementById('legal-hint-card').style.display = 'block';
    }
    syncStateToStorage();
  }

  function toggleLegalHint() {
    const hint = document.getElementById('legal-hint-card');
    if (hint) hint.style.display = (hint.style.display === 'block') ? 'none' : 'block';
  }

  function navigateNext() {
    if (isExamMode && AppState.currentIndex === AppState.sessionQueue.length - 1) {
      finishOfficialExam();
      return;
    }
    if (AppState.currentIndex < AppState.sessionQueue.length - 1) AppState.currentIndex++;
    else AppState.currentIndex = 0;
    syncStateToStorage();
    renderCurrentQuestion();
  }

  function navigatePrevious() {
    if (AppState.currentIndex > 0) AppState.currentIndex--;
    syncStateToStorage();
    renderCurrentQuestion();
  }

  function triggerShuffleBlock() { 
    buildSessionQueue('random'); 
    renderCurrentQuestion(); 
  }

  function renderDashboardUI() {
    document.getElementById('ui-errors-count').innerText = (AppState.errorIds || []).length;
    document.getElementById('ui-fav-count').innerText = (AppState.favoritesIds || []).length;
    let accuracy = AppState.totalAnswered > 0 ? Math.round((AppState.correctCount / AppState.totalAnswered) * 100) : 0;
    document.getElementById('ui-accuracy-rate').innerText = accuracy + '%';
    document.getElementById('ui-progress-pos').innerText = `${AppState.currentIndex + 1} / ${AppState.sessionQueue.length}`;
    
    let totalDatabaseSize = RAW_EXCEL_TESTS.length || 1;
    let masteredCount = GlobalMasteredIds.length;
    let percent = Math.min(100, Math.round((masteredCount / totalDatabaseSize) * 100));

    document.getElementById('ui-global-progress-text').innerText = `${masteredCount} / ${totalDatabaseSize} (${percent}%)`;
    document.getElementById('ui-global-progress-bar').style.width = percent + '%';
  }

  function openRandomTask() {
    const pool = RAW_EXCEL_TESTS;
    if (pool.length === 0) return;
    let chosen = pool[Math.floor(Math.random() * pool.length)];
    AppState.sessionQueue.splice(AppState.currentIndex + 1, 0, { ...chosen, topic: "🔀 Случайная задача" });
    navigateNext();
  }

  function openTopicsModal() {
    document.getElementById('modal-title-text').innerText = "📚 Каталог задач и поиск";
    document.getElementById('modal-search-wrapper').style.display = 'block';
    renderTopicsList(RAW_EXCEL_TESTS);
    document.getElementById('topics-modal').style.display = 'flex';
  }
  function closeTopicsModal() { document.getElementById('topics-modal').style.display = 'none'; }

  function renderTopicsList(questionsPool) {
    const container = document.getElementById('topics-list-container');
    let html = `
      <div class="topic-card">
        <div style="font-weight: 700; font-size: 0.9em; color: var(--accent-cyan);">📚 Все задачи (${questionsPool.length})</div>
        <button class="block-btn" onclick="selectModeAndStart('sequential', 0)" style="width: 100%; margin-top:6px;">Запустить по порядку</button>
      </div>
    `;
    container.innerHTML = html;
  }

  function filterTopicsAndQuestions(keyword) {
    const term = keyword.toLowerCase().trim();
    if (!term) {
      renderTopicsList(RAW_EXCEL_TESTS);
      return;
    }
    let matched = RAW_EXCEL_TESTS.filter(q => (q.question && q.question.toLowerCase().includes(term)) || (q.topic && q.topic.toLowerCase().includes(term)));
    const container = document.getElementById('topics-list-container');
    let html = `<div style="font-size: 0.8em; color: var(--accent-cyan); margin-bottom:8px;">Найдено задач: ${matched.length}</div>`;
    
    matched.slice(0, 30).forEach((q) => {
      let realIndex = RAW_EXCEL_TESTS.findIndex(item => item.id === q.id);
      html += `
        <div class="topic-card" onclick="selectModeAndStart('sequential', ${realIndex})" style="cursor:pointer;">
          <div style="font-size: 0.7em; color: var(--text-muted);">Задача №${q.originalIndex}</div>
          <div style="font-weight: 600; font-size: 0.82em; color: #fff; margin-top: 2px;">${q.question.substring(0, 90)}...</div>
        </div>
      `;
    });
    container.innerHTML = html;
  }

  window.onload = loadReadmeAndInit;
</script>
</body>
</html>
